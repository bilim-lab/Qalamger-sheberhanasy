function gradeGuide(p){if(p.mode==='ted')return ESSAYGOALS[p.grade]+' Эсседегі ойды ауызша сөзіңе негіз ет.';if(p.grade===5)return 'Жазба негізін авторға хат немесе өлең түрінде дайында. Содан кейін таңдаған шығармашылық форматыңда ұсын.';if(p.grade===6)return 'Табиғат көрінісін, оқиға орнын не кейіпкерді көркемдегіш құралдармен сипатта. Оны өніміңе енгіз.';if(p.grade===7)return 'Оқиғаны өз көзқарасыңмен дамыт. Жаңа шешімнің салдары жазба жұмысыңда көрінсін.';if(p.grade===8)return 'Түпнұсқадан алынған үзіндіні жаңа шығармашылық формада қайта өңде.';return 'Автор стилінің екі белгісін анықта. Оларды өз шығармашылық жазбаңда қолданып, түсіндір.';}
function sideHtml(p){const m=MODES[p.mode],o=objective(p);return `<aside class="sidepanel"><div class="eyebrow">БАҒЫТ БАҒДАРЫ</div><h3>${m.name}</h3><p>${m.help}</p><hr><span class="badge">${o.code}</span><p>${esc(o.text)}</p><p><small>${o.note}</small></p><hr><h3>Жұмысыңның үш тірегі</h3><ul><li>Түпнұсқадан нақты дәлел</li><li>Өзің қабылдаған шешім</li><li>Өзгерісті түсіндіру</li></ul><hr><p>Жазғандарың осы браузерде сақталады. Ортақ құрылғыда жұмыс соңында көшірмеңді жүктеп ал.</p></aside>`;}
function step0(p){return `<h2>Туындының бастауында — мәтін</h2><p class="sub">Жаттығу мәтінімен байқап көр немесе оқулықтағы шығармаңның үзіндісін енгіз.</p><div class="formrow"><label class="field"><span>Сынып</span><select data-field="grade">${[5,6,7,8,9].map(g=>`<option value="${g}" ${p.grade===g?'selected':''}>${g}-сынып</option>`).join('')}</select></label>${field('Өзіңді қалай атаймыз?','alias',p.alias,'Есім немесе бүркеншік ат','input','maxlength="60"')}</div><label class="field"><span>Шығарманы таңда</span><select data-field="work"><option value="demo" ${p.work==='demo'?'selected':''}>«Ескі өрік» — жаттығу мәтіні</option>${WORKS[p.grade].map(w=>`<option value="${esc(w)}" ${p.work===w?'selected':''}>${esc(w)}</option>`).join('')}<option value="custom" ${p.work==='custom'?'selected':''}>Өз шығармам / басқа мәтін</option></select></label>${field('Шығарма немесе жұмыс атауы','title',p.title,'Атауын жаз','input','maxlength="180"')}${p.work==='demo'?'<p class="help">Шеберханаға арнайы әзірленген жаттығу мәтіні. Оқу бағдарламасындағы міндетті шығарма емес.</p>':'<p class="help">Үзіндіні оқулықтан енгіз. Авторды, басылымды немесе бет нөмірін мәтін соңында көрсет.</p>'}${field('Жұмысқа негіз болатын үзінді','source',p.source,'Үзіндіні осында енгіз…','textarea','class="source"')}<div class="hint"><strong>Тапсырма</strong><br>${MODES[p.mode].task}<br><br><strong>${p.grade}-сыныпқа бейімдеу:</strong> ${gradeGuide(p)}</div><label class="field"><span>Қандай қолдау қажет?</span><select data-field="level"><option value="support" ${p.level==='support'?'selected':''}>Бағыттаушы жоспар керек</option><option value="standard" ${p.level==='standard'?'selected':''}>Өз бетімше орындаймын</option><option value="challenge" ${p.level==='challenge'?'selected':''}>Күрделі тапсырманы таңдаймын</option></select></label>`;}
function step1(p){const m=MODES[p.mode];return `<h2>Алғашқы ойыңды қағазға түсір</h2><p class="sub">Алдымен өз нұсқаңды жаз. ЖИ ұсынысын келесі қадамда қарастырасың.</p><details><summary>Негізгі мәтінді ашу</summary><div class="sourcesummary">${esc(p.source)||'Алдымен мәтін енгіз.'}</div></details>${field('Өніміңде жеткізгің келетін негізгі ой','idea',p.idea,'Бір-екі сөйлеммен тұжырымда…')}${field('Мәтіннен екі дәлел','evidence',p.evidence,'1. Үзінді немесе нақты деталь және оның мағынасы.\n2. Екінші дәлел және оның мағынасы.')}${p.level==='support'?`<div class="hint"><strong>Бағыттаушы жоспар</strong><div style="white-space:pre-line">${m.scaffold}</div></div>`:''}${p.level==='challenge'?`<div class="hint green"><strong>Күрделі міндет</strong><br>${m.challenge}</div>`:''}${field(m.draft,'draft',p.draft,m.help,'textarea','class="large"')}<div class="wordline"><span id="draftcount">${words(p.draft)} сөз</span><span>Көлемін мұғаліммен келіс</span></div>${p.snapshot?'<div class="hint green">Алғашқы нұсқаның көшірмесі сақталған. Салыстыруда сол көшірме қолданылады.</div>':''}<button class="btn secondary small" data-action="freeze">${p.snapshot?'Алғашқы нұсқаны жаңарту':'Алғашқы нұсқаны бекіту'}</button>`;}
function makePrompt(p){return `Сен әдеби шығармашылық бойынша сұрақ қоятын көмекшісің. Мен ${p.grade}-сынып оқушысымын. Бағытым: ${MODES[p.mode].name}.\n\nШығарма: ${p.title}\nҮзінді:\n${p.source}\n\nНегізгі ойым: ${p.idea}\nМәтіндік дәлелдерім:\n${p.evidence}\nАлғашқы нұсқам:\n${p.snapshot||p.draft}\n\nМенің орныма дайын туынды жазба. Тек:\n1. Ойымды тереңдететін үш сұрақ қой.\n2. Мәтінмен тексеруді қажет ететін екі тұсты көрсет.\n3. Бір шығармашылық шешімге екі ықтимал бағыт ұсын.\n4. Үзіндіде жоқ деректі және дәйексөзді ойдан қоспа. Болжам болса, оны белгіле.\n5. Қазақ тілінде қысқа жауап бер. Соңғы шешімді өзім қабылдаймын.`;}
function step2(p){return `<h2>ЖИ ұсынысына сын көзбен қара</h2><p class="sub">Бұл бөлім сұраныс құрастырады. Тікелей ЖИ байланысы қосылмаған: сұранысты мұғаліммен бірге қолданатын ЖИ сервисіне көшіріп, жауабын осында енгіз.</p>${!p.snapshot?'<div class="requirednote">Алдымен «Алғашқы ой» қадамында өз нұсқаңды жазып, бекіт.</div>':''}<h3>Ойлануға арналған үш сұрақ</h3>${MODES[p.mode].questions.map((q,i)=>`<div class="question"><b>0${i+1}</b> ${q}</div>`).join('')}<p class="help">Бұл — алдын ала дайындалған әдістемелік сұрақтар.</p><h3>Өз жұмысыңа арналған сұраныс</h3><div class="prompt" id="prompttext">${esc(makePrompt(p))}</div><div class="actions" style="margin:12px 0"><button class="btn secondary small" data-action="copy-prompt" ${!p.snapshot?'disabled':''}>Сұранысты көшіру</button></div>${field('ЖИ-ден алынған жауап','aiResponse',p.aiResponse,'Қолданған сервисіңнің атауын және жауабын осында енгіз…')}${field('Қай ұсынысты қабылдайсың? Неліктен?','accepted',p.accepted,'Мәтінге сүйеніп түсіндір…')}${field('Қай ұсыныспен келіспейсің немесе нені тексеру керек?','rejected',p.rejected,'Түпнұсқамен салыстырып түсіндір…')}<div class="hint">ЖИ қолданбасаң, жоғарыдағы үш сұрақпен өз жұмысыңды талда. Рефлексияда ЖИ қолданылмағанын көрсет.</div>`;}
function scenesHtml(p){return `<h3>Кадрлар жоспары</h3><p class="sub">Әр көрініс негізгі ойға қызмет етсін. Ұсынылатын жалпы ұзақтық — 60–90 секунд.</p><div id="scenes">${p.scenes.map((s,i)=>`<section class="scene"><div class="scenehead"><strong>КАДР ${i+1}</strong><button class="btn ghost small" data-remove-scene="${i}" ${p.scenes.length<=1?'disabled':''}>Алып тастау</button></div><label class="field"><span>Көрініс және әрекет</span><textarea data-scene="${i}" data-key="visual" placeholder="Көрермен не көреді?">${esc(s.visual)}</textarea></label><label class="field"><span>Диалог немесе автор сөзі</span><textarea data-scene="${i}" data-key="speech" placeholder="Кадрда қандай сөз айтылады?">${esc(s.speech)}</textarea></label><div class="formrow"><label class="field"><span>Дыбыс, музыка немесе тыныштық</span><input data-scene="${i}" data-key="sound" value="${esc(s.sound)}" placeholder="Дыбыстың мағынасы қандай?"></label><label class="field"><span>Ұзақтығы, секунд</span><input type="number" min="1" max="300" data-scene="${i}" data-key="duration" value="${s.duration}"></label></div></section>`).join('')}</div><div class="actions"><button class="btn secondary small" data-action="add-scene" ${p.scenes.length>=12?'disabled':''}>+ Кадр қосу</button><span class="help" id="durationtotal">Барлығы: ${totalSeconds(p)} секунд</span></div><button class="btn secondary small" style="margin-top:14px" data-action="scene-text">Кадрлардан сценарий мәтінін құрастыру</button>`;}
const totalSeconds=p=>p.scenes.reduce((a,s)=>a+(Number(s.duration)||0),0);
function sceneText(p){return p.scenes.map((s,i)=>`Кадр ${i+1} · ${s.duration} секунд\nКөрініс: ${s.visual}\nСөз: ${s.speech}\nДыбыс: ${s.sound}`).join('\n\n');}
function timerHtml(p){return `<div class="timer"><label>Сөйлеу уақыты<select id="timerminutes" aria-label="Таймер ұзақтығы">${[3,4,5].map(n=>`<option value="${n}" ${Number(p.timerMinutes)===n?'selected':''}>${n} мин</option>`).join('')}</select></label><div class="timerdisplay" id="timerdisplay" role="timer">${formatTime(timerProject===p.id?timerRemaining:p.timerMinutes*60)}</div><div class="actions"><button class="btn small" data-action="timer-toggle" id="timerbutton">${timerHandle&&timerProject===p.id?'Кідірту':'Бастау'}</button><button class="btn small" data-action="timer-reset">Қайта бастау</button></div><p id="timerhint">Алдымен дайын мәтініңді дауыстап оқып көр.</p></div>`;}
function step3(p){return `<h2>Өз туындыңды жетілдір</h2><p class="sub">Таңдаған ұсыныстарыңды қолдан. Өз үнің мен мәтінге сүйенген ойың сақталсын.</p>${p.mode==='director'?scenesHtml(p):''}${field('Жетілдірілген авторлық нұсқа','final',p.final,'Жетілдірілген жұмысыңды осында жаз…','textarea','class="large"')}<div class="wordline"><span id="finalcount">${words(p.final)} сөз</span><span>Авторлық шешім — өзіңдікі</span></div><button class="btn secondary small" style="margin-top:12px" data-action="copy-draft">Алғашқы нұсқаны негізге алу</button>${p.mode==='ted'?timerHtml(p):''}${p.mode==='voice'?`<h3>Монологіңді тыңдап көр</h3><p class="sub">Телефондағы диктофонға жазып, аудионы осы жерден тыңда. Аудио тек осы сеанста ойнатылады және портфолио файлына кірмейді.</p><input id="audiofile" class="audioinput" type="file" accept="audio/*" aria-label="Аудиожазбаны таңдау"><audio id="audioplayer" controls ${audioUrl?`src="${audioUrl}"`:''}></audio>`:''}<h3>Алғашқы және соңғы нұсқа</h3><div class="compare"><div><h3>Алғашқы ой</h3><pre>${esc(p.snapshot)||'Бекітілген алғашқы нұсқа әзірге жоқ.'}</pre></div><div><h3>Жетілдірілген нұсқа</h3><pre id="finalpreview">${esc(p.final)||'Мәтін жазылғанда осы жерде көрінеді.'}</pre></div></div>${field('Нені өзгерттің және неліктен?','reason',p.reason,'Кемінде бір өзгерісті ата. Оның мәтінге немесе негізгі ойға әсерін түсіндір.')}`;}
const RUBRICS=[['Мәтінді түсіну','Негізгі ойды дұрыс түсіндіремін; екі мәтіндік дәлел келтіремін.'],['Авторлық шешім','Өз шығармашылық шешімімді ұсынамын; оны мәтінмен байланыстырып түсіндіремін.'],['Өнімнің тұтастығы','Таңдаған жанрдың құрылымын сақтаймын; барлық бөлікті негізгі ойға бағындырамын.'],['Рефлексия','Бір нақты өзгерістің себебін айтамын; келесі жұмысыма өлшенетін мақсат қоямын.']];
function assessed(p){return p.rubric.every(x=>x!==null&&x!=='');}
function score(p){return p.rubric.reduce((a,x)=>a+(Number(x)||0),0);}
function step4(p){return `<h2>Шығармашылық шешіміңді қорға</h2><p class="sub">Әр критерийде екі әрекет бар. Екеуі орындалса — 2 балл, біреуі — 1 балл, екеуі де орындалмаса — 0 балл.</p>${RUBRICS.map(([n,d],i)=>`<div class="rubric"><div><strong>${n}</strong><p>${d}</p></div><select data-rubric="${i}" aria-label="${n} бойынша өзіндік бағалау"><option value="" ${p.rubric[i]===null?'selected':''}>Таңда…</option>${[0,1,2].map(n=>`<option value="${n}" ${p.rubric[i]===n?'selected':''}>${n} балл</option>`).join('')}</select></div>`).join('')}<div class="metric"><div><b class="score" id="scorevalue">${assessed(p)?score(p):'—'} <small>/ 8</small></b><span>Өзіндік бағалау · автоматты баға емес</span></div></div>${field('Ойың бүгінгі өмірмен қалай байланысады?','life',p.life,'Бір нақты өмірлік жағдаятпен байланыстыр.')}${field('Келесі жұмысыңа қандай мақсат қоясың?','nextGoal',p.nextGoal,'Мысалы: келесі монологте екі мәтіндік дәлелді орынды қолданамын.')}${field('Мұғалімнің кері байланысы','teacher',p.teacher,'Мұғаліммен талқылаған соң толтырылады.')}<label class="check"><input type="checkbox" data-field="declaration" ${p.declaration?'checked':''}><span>Өз үлесімді түсіндіре аламын. ЖИ қолдансам, оның ұсыныстарын мәтінмен тексеріп, қолдану сипатын жұмысымда көрсеттім.</span></label><div class="hint green">${completion(p)===5?'Бес қадам толтырылды. Жұмысыңды мұғалімге көрсетуге болады.':'Жұмысты толықтыру үшін мәтін, алғашқы нұсқа, ұсыныстарды талдау, соңғы нұсқа және рефлексияны тексер.'}</div><div class="actions"><button class="btn" data-action="export-project">Жұмысты жүктеу</button><button class="btn secondary" data-action="print-project">Басып шығару / PDF</button></div>`;}
function workHtml(){const p=current();if(!p)return homeHtml();const m=MODES[p.mode];return `<section class="workhead"><div><div class="eyebrow">${m.tag}</div><h1>${m.name}</h1><p>${esc(p.title||'Жаңа жұмыс')} · ${p.grade}-сынып</p></div><div class="actions"><button class="btn secondary small" data-action="new-project">+ Жаңа жұмыс</button><button class="btn secondary small" data-action="export-project">Жүктеу ↓</button></div></section><nav class="stepper" aria-label="Жұмыс қадамдары">${['Мәтін','Алғашқы ой','ЖИ және талдау','Өз туындың','Бағалау'].map((n,i)=>`<button class="${step===i?'active':''}" data-step="${i}" ${step===i?'aria-current="step"':''}><span>${i+1}</span>${n}</button>`).join('')}</nav><div class="workspace"><section class="panel">${[step0,step1,step2,step3,step4][step](p)}<div class="nextrow"><button class="btn ghost" data-action="previous" ${step===0?'disabled':''}>← Алдыңғы</button>${step<4?'<button class="btn" data-action="next">Келесі қадам →</button>':'<button class="btn secondary" data-nav="portfolio">Портфолиоға өту →</button>'}</div></section>${sideHtml(p)}</div>`;}
function completion(p){return [!!p.source.trim(),!!p.snapshot.trim(),!!(p.accepted.trim()||p.rejected.trim()),!!(p.final.trim()&&p.reason.trim()),assessed(p)&&!!p.nextGoal.trim()&&p.declaration].filter(Boolean).length;}
function portfolioHtml(){const ps=[...data.projects].sort((a,b)=>b.updated.localeCompare(a.updated));return `<section class="workhead"><div><div class="eyebrow">СЕНІҢ ШЫҒАРМАШЫЛЫҚ ЖОЛЫҢ</div><h1>Менің портфолиом</h1><p>Алғашқы ойыңнан соңғы туындыңа дейінгі барлық жұмыс.</p></div></section><div class="actions" style="margin:0 0 22px"><button class="btn secondary" data-action="export-all">Барлық жұмыстың көшірмесі ↓</button><button class="btn secondary" data-action="import">Көшірмені ашу ↑</button><button class="btn ghost" data-action="download-app">Шеберхананы офлайн жүктеу ↓</button><input id="importfile" type="file" accept=".json,application/json" hidden></div><p class="notice">Жұмыстар осы браузерде сақталады. Басқа құрылғыға көшіру үшін JSON көшірмесін жүктеп, сол құрылғыда аш. Аудионы жеке сақта.</p>${ps.length?`<div class="portgrid">${ps.map(p=>`<article class="portcard"><span class="badge">${MODES[p.mode].name}</span><h3>${esc(p.title||'Атаусыз жұмыс')}</h3><p>${p.grade}-сынып${p.alias?' · '+esc(p.alias):''}</p><p>${new Date(p.updated).toLocaleDateString('kk-KZ')} · ${words(p.final||p.draft)} сөз</p><div class="progress" role="progressbar" aria-valuenow="${completion(p)}" aria-valuemin="0" aria-valuemax="5" aria-label="Толтырылған қадамдар"><i style="width:${completion(p)*20}%"></i></div><p>${completion(p)} / 5 қадам толтырылған${assessed(p)?' · өзіндік баға '+score(p)+'/8':''}</p><div class="actions"><button class="btn small" data-open="${p.id}">Жұмысты ашу</button><button class="btn secondary small" data-export="${p.id}">Жүктеу</button><button class="btn ghost small" data-delete="${p.id}">Жою</button></div></article>`).join('')}</div>`:'<div class="empty">'+svg('folder',32)+'<h2>Алғашқы туындыңды баста</h2><p>Төрт бағыттың бірін таңда. Жазғандарың осында жинақталады.</p><button class="btn" data-nav="home">Шеберханаға оралу</button></div>'}`;}
function teacherHtml(){return `<section class="workhead"><div><div class="eyebrow">ПЕДАГОГИКАЛЫҚ БАҒДАР</div><h1>Мұғалімге</h1><p>Мақсат — әдеби мәтінге сүйенген дербес шығармашылық шешім.</p></div></section><div class="teachergrid"><section class="panel"><h2>Шеберхананы қалай өткіземіз?</h2><ol><li><strong>Мәтінді таңдаңыз.</strong> Бір сынып пен бір шығарманы негіз етіңіз. Оқушыларға түпнұсқаны алдын ала оқуға беріңіз.</li><li><strong>Бағытты анықтаңыз.</strong> Қызығушылық пен бастапқы жұмысқа қарай төрт бөлімнің бірін таңдауға мүмкіндік беріңіз.</li><li><strong>Алғашқы нұсқаны сақтаңыз.</strong> ЖИ ұсынысын қарастырмас бұрын оқушының өз ойы тіркелсін.</li><li><strong>Салыстыруды ұйымдастырыңыз.</strong> Оқушы әр ұсынысты мәтінмен тексеріп, қабылдау себебін түсіндірсін.</li><li><strong>Өзгерісті бағалаңыз.</strong> Екі нұсқаны салыстырып, бір нақты ілгерілеу мен келесі мақсатты белгілеңіз.</li></ol></section><section class="panel"><h2>Саралау және ЖИ қолдану</h2><p><strong>Қолдау:</strong> бағыттаушы жоспар мен сұрақтар.</p><p><strong>Дербестік:</strong> идеяны, дәлелді және форманы өз бетінше таңдау.</p><p><strong>Күрделендіру:</strong> баламаларды салыстырып, көркемдік шешімді қорғау.</p><div class="hint">ЖИ сервисі бұл сайтқа қосылмаған. Оқушы құрастырылған сұранысты мұғалімнің сүйемелдеуімен тиісті сервиске көшіріп қолданады. Қызметтің жас талаптарын ескеріп, жеке деректерді енгізбеңіз.</div><p>Ашық жауапқа автоматты дұрыс/бұрыс бағасы қойылмайды. Мұғалім мәтіннің мазмұнын, оқушының дербестігін және келтірген дәлелін бағалайды.</p></section></div><section class="panel" style="margin-top:20px"><h2>«Қазақ әдебиеті» бойынша тірек оқу мақсаттары</h2><p class="sub">Шығармашылық жазылым мақсаты — .2.4.1; «Әдеби TEDx» сөзінің жазба негізі — .3.3.1. Қосымша мақсатты нақты сабаққа сәйкес мұғалім таңдайды.</p><div class="tablewrap"><table><thead><tr><th>Сынып</th><th>Шығармашылық жазылым</th><th>Әдеби эссе</th></tr></thead><tbody>${[5,6,7,8,9].map(g=>`<tr><td>${g}</td><td><b>${g}.2.4.1</b><br>${GOALS[g]}</td><td><b>${g}.3.3.1</b><br>${ESSAYGOALS[g]}</td></tr>`).join('')}</tbody></table></div><p class="help">Негізі: берілген 5–9-сыныптарға арналған қазақ әдебиеті оқу бағдарламасы. Сайттағы қысқа мәтіндер — мақсаттардың ықшам түсіндірмесі.</p></section><section class="panel" style="margin-top:20px"><h2>Бағалауға жиналатын дәлелдер</h2><p>Түпнұсқа үзіндісі · бастапқы нұсқа · ЖИ сұранысы мен жауабы (қолданылса) · ұсынысқа оқушының бағасы · соңғы өнім · өзгерістің себебі · мұғалімнің кері байланысы.</p><p>Жүлде нәтижелерін осы жұмыстың әсері деп автоматты түрде түсіндірмеңіз. Тиімділікті бірдей критериймен бағаланған нақты бастапқы және соңғы жұмыстар арқылы талдаңыз.</p><div class="actions"><button class="btn secondary" data-nav="portfolio">Портфолионы ашу</button><button class="btn secondary" data-action="download-app">Офлайн нұсқаны жүктеу</button></div></section>`;}
function render(){document.title=(view==='work'&&current()?MODES[current().mode].name+' · ':'')+'Қаламгер шеберханасы';$('nav').innerHTML=navHtml();$('view').innerHTML=view==='home'?homeHtml():view==='work'?workHtml():view==='portfolio'?portfolioHtml():teacherHtml();$('crumb').textContent=view==='home'?'Әдебиет / Шығармашылық шеберхана':view==='work'?'Шеберхана / '+(current()?MODES[current().mode].name:''):view==='portfolio'?'Шеберхана / Портфолио':'Шеберхана / Мұғалімге';if(!saveAvailable)$('savestatus').textContent='Сақтау қолжетімсіз · көшірме жүктеңіз';updateTimer();}
function freeze(p){if(!p.draft.trim()){toast('Алдымен өз нұсқаңды жаз.');return false;}p.snapshot=p.draft;touch();return true;}
function moveStep(n){const p=current();if(!p)return;if(n>0&&!p.source.trim()){toast('Алдымен жұмысқа негіз болатын үзіндіні енгіз.');step=0;render();return;}if(n>=2&&!p.snapshot){if(!freeze(p)){step=1;render();return;}}step=Math.max(0,Math.min(4,n));render();window.scrollTo({top:0,behavior:'auto'});}
function confirmBox(title,message,action){$('modalroot').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div><h2 id="dialogtitle">${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button class="btn" id="confirmyes">Растау</button><button class="btn secondary" id="confirmno">Бас тарту</button></div></div></div>`;const previous=document.activeElement;$('confirmno').focus();const close=()=>{$('modalroot').innerHTML='';document.removeEventListener('keydown',key);if(previous&&document.contains(previous))previous.focus();};const key=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('confirmno')?$('confirmyes'):$('confirmno')).focus();}};document.addEventListener('keydown',key);$('confirmyes').onclick=()=>{close();action();};$('confirmno').onclick=close;}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Сұраныс көшірілді.');}catch(e){$('modalroot').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Сұранысты көшіру"><div><h2>Сұранысты көшір</h2><p>Мәтінді белгілеп, Ctrl+C немесе «Көшіру» командасын қолдан.</p><textarea id="manualcopy" readonly>${esc(text)}</textarea><button class="btn" id="closecopy" style="margin-top:12px">Жабу</button></div></div>`;$('manualcopy').select();$('closecopy').onclick=()=>{$('modalroot').innerHTML='';};}}
function download(filename,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function projectText(p){const ratings=RUBRICS.map(([n],i)=>`${n}: ${p.rubric[i]===null?'бағаланбаған':p.rubric[i]+' / 2'}`).join('\n');return `ҚАЛАМГЕР ШЕБЕРХАНАСЫ\n${MODES[p.mode].name}\n\nШығарма: ${p.title}\nСынып: ${p.grade}\nОқушы: ${p.alias||'көрсетілмеген'}\n\nНЕГІЗГІ МӘТІН\n${p.source}\n\nНЕГІЗГІ ОЙ\n${p.idea}\n\nМӘТІНДІК ДӘЛЕЛДЕР\n${p.evidence}\n\nАЛҒАШҚЫ НҰСҚА\n${p.snapshot||p.draft}\n\nЖИ СҰРАНЫСЫ\n${makePrompt(p)}\n\nЖИ ЖАУАБЫ\n${p.aiResponse||'Енгізілмеген / ЖИ қолданылмады'}\n\nҚАБЫЛДАҒАН ҰСЫНЫС ЖӘНЕ СЕБЕБІ\n${p.accepted}\n\nҚАБЫЛДАМАҒАН НЕМЕСЕ ТЕКСЕРІЛЕТІН ҰСЫНЫС\n${p.rejected}\n\nСОҢҒЫ ӨНІМ\n${p.final}${p.mode==='director'?'\n\nКАДРЛАР ЖОСПАРЫ\n'+sceneText(p):''}\n\nӨЗГЕРІСТІҢ СЕБЕБІ\n${p.reason}\n\nӨМІРМЕН БАЙЛАНЫС\n${p.life}\n\nКЕЛЕСІ МАҚСАТ\n${p.nextGoal}\n\nӨЗІНДІК БАҒАЛАУ\n${ratings}\nЖиынтық: ${assessed(p)?score(p)+' / 8':'бағалау аяқталмаған'}\n\nМҰҒАЛІМНІҢ КЕРІ БАЙЛАНЫСЫ\n${p.teacher}\n\nАвторлық үлесін растау: ${p.declaration?'расталды':'әлі расталмады'}\n\nСоңғы өзгеріс: ${new Date(p.updated).toLocaleString('kk-KZ')}\n`;} 
function exportProject(p){download('Qalamger_'+p.mode+'_'+p.id+'.txt','\ufeff'+projectText(p),'text/plain;charset=utf-8');toast('Жұмыс мәтіндік файлға жүктелді.');}
function printProject(p){const w=window.open('','_blank');if(!w){toast('Басып шығару үшін браузердегі қалқымалы терезеге рұқсат бер.');return;}w.document.write('<!doctype html><html lang="kk"><head><meta charset="UTF-8"><title>'+esc(p.title)+'</title><style>body{font:12pt/1.65 Georgia,serif;max-width:760px;margin:35px auto;padding:20px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0;padding:0}@page{margin:20mm}}</style></head><body><pre>'+esc(projectText(p))+'</pre></body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250);}
function formatTime(sec){const n=Math.max(0,Math.ceil(sec));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function updateTimer(){if(!current()||timerProject!==currentId)return;if($('timerdisplay'))$('timerdisplay').textContent=formatTime(timerRemaining);if($('timerbutton'))$('timerbutton').textContent=timerHandle?'Кідірту':'Бастау';}
function stopTimer(){clearInterval(timerHandle);timerHandle=null;}
function resetTimer(){stopTimer();const p=current();timerProject=p.id;timerRemaining=Number(p.timerMinutes)*60;updateTimer();if($('timerhint'))$('timerhint').textContent='Алдымен дайын мәтініңді дауыстап оқып көр.';}
function toggleTimer(){const p=current();if(timerProject!==p.id){stopTimer();timerProject=p.id;timerRemaining=Number(p.timerMinutes)*60;}if(timerHandle){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));stopTimer();updateTimer();return;}if(timerRemaining<=0)timerRemaining=Number(p.timerMinutes)*60;timerEnd=Date.now()+timerRemaining*1000;timerHandle=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(!timerRemaining){stopTimer();toast('Сөйлеу уақыты аяқталды. Қорытындыңды түйінде.');if($('timerhint'))$('timerhint').textContent='Уақыт аяқталды. Қорытындыңды түйінде.';}updateTimer();},250);updateTimer();}
function cleanImport(raw){if(!raw||raw.version!==1||!Array.isArray(raw.projects)||raw.projects.length>200)throw Error('Көшірме форматы жарамсыз.');return raw.projects.map(x=>{if(!x||!Object.prototype.hasOwnProperty.call(MODES,x.mode))throw Error('Белгісіз шығармашылық бағыт.');const p=fresh(x.mode);for(const k of Object.keys(p)){if(typeof p[k]==='string'&&typeof x[k]==='string')p[k]=x[k].slice(0,200000);}p.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);p.grade=[5,6,7,8,9].includes(Number(x.grade))?Number(x.grade):7;p.level=['support','standard','challenge'].includes(x.level)?x.level:'standard';p.work=['demo','custom',...WORKS[p.grade]].includes(x.work)?x.work:'custom';p.rubric=Array.from({length:4},(_,i)=>[0,1,2].includes(x.rubric?.[i])?x.rubric[i]:null);p.declaration=x.declaration===true;p.timerMinutes=[3,4,5].includes(Number(x.timerMinutes))?Number(x.timerMinutes):3;if(Array.isArray(x.scenes))p.scenes=x.scenes.slice(0,12).filter(s=>s&&typeof s==='object').map(s=>({visual:String(s.visual||'').slice(0,20000),speech:String(s.speech||'').slice(0,20000),sound:String(s.sound||'').slice(0,2000),duration:Math.min(300,Math.max(1,Number(s.duration)||20))}));if(!p.scenes.length)p.scenes=fresh(x.mode).scenes;p.updated=new Date().toISOString();if(!Number.isFinite(Date.parse(p.created)))p.created=p.updated;return p;});}
async function importFile(file){if(!file)return;if(file.size>10*1024*1024){toast('Файл тым үлкен. 10 МБ-қа дейінгі көшірмені таңда.');return;}try{const projects=cleanImport(JSON.parse(await file.text()));if(data.projects.length+projects.length>200){toast('200 жұмыстан артық импорттауға болмайды.');return;}data.projects.push(...projects);save();render();toast(projects.length+' жұмыс қосылды. Бұрынғы жұмыстар сақталды.');}catch(e){toast('Файл ашылмады. Шеберханадан алынған JSON көшірмесін таңда.');}}
async function downloadApp(){try{download('Qalamger_sheberhanasy.html',APP_SOURCE,'text/html;charset=utf-8');toast('Офлайн шеберхана жүктелді. Жұмыстарыңды JSON көшірмесімен бөлек сақта.');}catch(e){toast('Файл жүктелмеді. Браузердің жүктеу рұқсатын тексер.');}}
document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-go]');if(!b||b.disabled)return;if(b.dataset.go){e.preventDefault();navigate(b.dataset.go);return;}if(b.dataset.nav){const v=b.dataset.nav;if(MODES[v])openMode(v);else navigate(v);return;}if(b.dataset.start){openMode(b.dataset.start);return;}if(b.dataset.step!==undefined){moveStep(Number(b.dataset.step));return;}if(b.dataset.open){if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null;}currentId=b.dataset.open;step=0;view='work';render();window.scrollTo(0,0);return;}if(b.dataset.export){const p=data.projects.find(p=>p.id===b.dataset.export);if(p)exportProject(p);return;}if(b.dataset.delete){const id=b.dataset.delete;confirmBox('Жұмысты жою','Бұл жұмыс осы құрылғыдан жойылады. Қажет болса, алдымен көшірмесін жүктеп ал.',()=>{data.projects=data.projects.filter(p=>p.id!==id);if(currentId===id)currentId=null;save();render();});return;}const p=current();if(b.dataset.removeScene!==undefined){p.scenes.splice(Number(b.dataset.removeScene),1);touch();render();return;}switch(b.dataset.action){case'next':moveStep(step+1);break;case'previous':moveStep(step-1);break;case'new-project':openMode(p.mode,true);break;case'freeze':if(p.snapshot)confirmBox('Алғашқы нұсқаны жаңарту','Салыстыруға сақталған алғашқы мәтін қазіргі нұсқамен ауыстырылады.',()=>{if(freeze(p)){render();toast('Алғашқы нұсқа жаңартылды.');}});else if(freeze(p)){render();toast('Алғашқы нұсқа сақталды.');}break;case'copy-prompt':copyText(makePrompt(p));break;case'copy-draft':{const apply=()=>{p.final=p.snapshot||p.draft;touch();render();};if(p.final.trim())confirmBox('Мәтінді ауыстыру','Жетілдірілген нұсқа алғашқы мәтінмен ауыстырылады.',apply);else apply();break;}case'add-scene':if(p.scenes.length<12){p.scenes.push({visual:'',speech:'',sound:'',duration:15});touch();render();}break;case'scene-text':{const apply=()=>{p.final=sceneText(p);touch();render();toast('Кадрлар жоспары сценарий мәтініне айналды.');};if(p.final.trim())confirmBox('Сценарийді жаңарту','Соңғы мәтін кадрлар жоспарынан қайта құрастырылады.',apply);else apply();break;}case'export-project':if(p)exportProject(p);break;case'print-project':if(p)printProject(p);break;case'export-all':download('Qalamger_portfolio_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');toast('Портфолио көшірмесі жүктелді.');break;case'import':$('importfile').click();break;case'download-app':downloadApp();break;case'timer-toggle':toggleTimer();break;case'timer-reset':resetTimer();break;}});
document.addEventListener('input',e=>{const el=e.target,p=current();if(!p)return;if(el.dataset.field&&el.tagName!=='SELECT'&&el.type!=='checkbox'){p[el.dataset.field]=el.value;touch();if(el.dataset.field==='draft'&&$('draftcount'))$('draftcount').textContent=words(p.draft)+' сөз';if(el.dataset.field==='final'){if($('finalcount'))$('finalcount').textContent=words(p.final)+' сөз';if($('finalpreview'))$('finalpreview').textContent=p.final||'Мәтін жазылғанда осы жерде көрінеді.';}}if(el.dataset.scene!==undefined){const s=p.scenes[Number(el.dataset.scene)];s[el.dataset.key]=el.dataset.key==='duration'?Math.min(300,Math.max(1,Number(el.value)||1)):el.value;touch();if($('durationtotal'))$('durationtotal').textContent='Барлығы: '+totalSeconds(p)+' секунд';}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='importfile'){importFile(el.files[0]);return;}const p=current();if(!p)return;if(el.id==='audiofile'){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=el.files[0]?URL.createObjectURL(el.files[0]):null;if($('audioplayer'))$('audioplayer').src=audioUrl||'';return;}if(el.id==='timerminutes'){p.timerMinutes=Number(el.value);touch();resetTimer();return;}if(el.dataset.rubric!==undefined){p.rubric[Number(el.dataset.rubric)]=el.value===''?null:Number(el.value);touch();render();return;}if(el.dataset.field==='declaration'){p.declaration=el.checked;touch();render();return;}if(el.dataset.field==='grade'){p.grade=Number(el.value);if(!['demo','custom',...WORKS[p.grade]].includes(p.work))p.work='custom';touch();render();return;}if(el.dataset.field==='level'){p.level=el.value;touch();render();return;}if(el.dataset.field==='work'){const newWork=el.value;const apply=()=>{p.work=newWork;p.title=newWork==='demo'?'Ескі өрік':newWork==='custom'?'':newWork;p.source=newWork==='demo'?DEMO:'';touch();render();};if(p.source.trim()&&newWork!==p.work){el.value=p.work;confirmBox('Негізгі мәтінді өзгерту','Шығарма атауы мен негізгі үзінді ауысады. Жазған нұсқаларың сақталады. Басқа шығармаға жеке жұмыс ашуға да болады.',apply);}else apply();}});
window.addEventListener('beforeunload',()=>{if(audioUrl)URL.revokeObjectURL(audioUrl);});
$('brandicon').innerHTML=svg('book',24);render();
</script>
</body>
</html>
